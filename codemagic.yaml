workflows:
  ios-simulator-check:
    name: iOS Simulator Build Check
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build for iOS Simulator (sem assinatura)
        script: flutter build ios --simulator --no-codesign
    artifacts:
      - build/ios/iphonesimulator/*.app

  ios-release:
    name: iOS Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: VetVem Individual
    environment:
      vars:
        BUNDLE_ID: "com.vetvem.vetvemPro"
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Fetch signing files (busca ou cria certificado/perfil)
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
      - name: Set up signing certificate
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Build ipa (assinado)
        script: flutter build ipa --release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
